version: "3.9"

# نسخه بهینه‌شده برای GitHub Codespaces
# تفاوت با docker-compose.yml اصلی:
#  - bot و worker بدون build (مستقیم روی host اجرا میشن)
#  - ports همه expose شدن
#  - resource limits سبک‌تر برای محیط dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-exchange_db}
      POSTGRES_USER:     ${POSTGRES_USER:-exchange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exchange_user}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # در Codespaces، bot و worker رو روی host اجرا میکنیم (poetry run ...)
  # اما اگه خواستی همه‌چیز داخل Docker باشه، این سرویس‌ها رو uncomment کن:

  # bot:
  #   build: { context: ., target: production }
  #   env_file: .env
  #   depends_on:
  #     db: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   command: python -m app.main
  #   volumes:
  #     - .:/workspace   # hot reload - کد تغییر کنه restart نمیخواد
  #   environment:
  #     PYTHONPATH: /workspace

  # worker:
  #   build: { context: ., target: production }
  #   env_file: .env
  #   depends_on: [db, redis]
  #   command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/3}
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
